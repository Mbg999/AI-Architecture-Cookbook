prompt_recipes:
  - id: serverless_function_design
    scenario: greenfield
    description: "Design serverless function architecture"
    prompt: |
      Design the serverless function architecture.

      Context:
      - Workload: [what the application does]
      - Invocation pattern: [API HTTP / event-driven / scheduled / orchestrated]
      - Expected traffic: [low / moderate / high / extreme]
      - Execution duration: [<5s / <5min / <15min]
      - State needs: [stateless / external / workflow]

      Requirements:
      - Function decomposition: what is a single-purpose function boundary
      - Event sources and triggers
      - API Gateway configuration (REST vs HTTP API)
      - Orchestration needs (Step Functions)
      - Error handling and DLQ strategy
      - Observability: monitoring, logging, tracing
      - Security: execution role, encryption, secrets

  - id: serverless_cold_start_mitigation
    scenario: performance
    description: "Mitigate cold starts in serverless functions"
    prompt: |
      Design a cold start mitigation strategy.

      Current cold start measurements:
      - Average cold start: [X ms]
      - p99 cold start: [Y ms]
      - Functions affected: [list]

      Mitigation options:
      1. Provisioned concurrency (keep N instances warm)
      2. SnapStart (Lambda SnapStart for Java, .NET)
      3. Smaller deployment packages (reduce dependencies)
      4. Language selection (Node/Python cold starts faster than Java/C#)
      5. Warmer functions via scheduled pings
      6. Function URL keep-alive

      For each: cost impact, complexity, expected latency improvement.

  - id: serverless_security_audit
    scenario: audit
    description: "Audit serverless function security"
    prompt: |
      Audit the serverless function security posture:

      1. Do execution roles follow least privilege?
      2. Are environment variables with secrets encrypted?
      3. Is API Gateway request validation enabled?
      4. Are reserved concurrency limits configured?
      5. Are VPC functions placed in private subnets with NAT?
      6. Are function URLs restricted with IAM auth?
      7. Is log data sanitized for PII?
      8. Are Lambda layers scanned for vulnerabilities?
      9. Are DLQs configured for async event sources?
      10. Are function timeouts set appropriately?

  - id: serverless_event_migration
    scenario: migration
    description: "Migrate synchronous API to async event-driven"
    prompt: |
      Migrate the synchronous order processing API to an event-driven
      architecture.

      Current architecture:
      [describe current synchronous flow]

      Target architecture:
      1. API Gateway receives order request
      2. Lambda validates and queues order (SQS)
      3. Order processor Lambda consumes from SQS asynchronously
      4. Downstream services (payment, inventory, shipping) react to events
      5. Order status updated in DynamoDB for client polling

      Migration steps:
      1. Implement SQS queue and DLQ
      2. Deploy order processor function
      3. Update API handler to queue instead of blocking
      4. Add order status endpoint for client polling
      5. Add idempotency key for duplicate detection
      6. Monitor queue depth and processing latency

anti_patterns:
  - name: "Monolithic Lambda Function"
    description: >
      A single Lambda function handling multiple API endpoints, business
      operations, and concerns. The function has a large deployment package,
      long cold start times, and couples operations that should scale and
      deploy independently.
    fix: "Split into single-purpose functions per operation; use event-driven architecture for coordination"
    severity: high
    related_pattern: single_purpose_lambda

  - name: "Lambda Calling Lambda Directly"
    description: >
      Functions invoke other functions synchronously via the Lambda API
      instead of using Step Functions or event-driven patterns. Creates
      tight coupling, cascading timeouts, and hidden invocation chains
      that are hard to monitor and debug.
    fix: "Use Step Functions for orchestration or SQS/EventBridge for async messaging"
    severity: high
    related_pattern: serverless_orchestration_step_functions

  - name: "Ignoring Cold Starts in Production"
    description: >
      No cold start mitigation for user-facing latency-sensitive functions.
      Users experience 1-5 second delays on infrequently called endpoints.
      Cold starts are not measured, monitored, or optimized.
    fix: "Use provisioned concurrency for latency-sensitive functions; measure cold starts per function; optimize package size"
    severity: medium
    related_pattern: lambda_api_gateway

