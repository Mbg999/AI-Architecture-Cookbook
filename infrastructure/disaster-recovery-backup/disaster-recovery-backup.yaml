# =============================================================================
# AI Architecture Cookbook — Disaster Recovery & Backup
# Schema: v3 | Domain: disaster-recovery-backup
# =============================================================================

meta:
  schema_version: 3
  domain: disaster-recovery-backup
  version: "1.0.0"
  last_updated: "2026-06-04"
  description: >
    Disaster recovery and backup strategies covering RPO/RTO-driven
    planning, backup-restore, pilot light, warm standby, and active-active
    multi-region architectures. Provides cost-conscious DR tier selection
    based on business requirements.

  tags:
    - disaster-recovery
    - backup
    - rpo
    - rto
    - cross-region
    - replication
    - business-continuity

  categories:
    - infrastructure

  prerequisites:
    - data-persistence
    - cloud-architecture
    - database-migration

  related_standards:
    - id: data-persistence
      relationship: complementary
      context: "Backup and restore operations manage persistent data lifecycle"
    - id: cloud-architecture
      relationship: complementary
      context: "Multi-region architectures depend on cloud provider capabilities"
    - id: database-migration
      relationship: complementary
      context: "Cross-region replication uses database migration patterns"
    - id: messaging-events
      relationship: complementary
      context: "Async replication between regions is event-driven"

context_inputs:
  - name: rpo_requirement
    type: enum
    description: "Maximum acceptable data loss (Recovery Point Objective)"
    required: true
    default: hours
    enum_values:
      - zero
      - seconds
      - minutes
      - hours
      - days

  - name: rto_requirement
    type: enum
    description: "Maximum acceptable downtime (Recovery Time Objective)"
    required: true
    default: hours
    enum_values:
      - zero
      - seconds
      - minutes
      - hours
      - days

  - name: budget
    type: enum
    description: "Budget for DR infrastructure"
    required: true
    default: moderate
    enum_values:
      - minimal
      - moderate
      - generous

  - name: compliance_requirements
    type: enum
    description: "Regulatory compliance obligations for DR"
    required: false
    default: none
    enum_values:
      - none
      - standard
      - strict

decision_tree:
  - id: near_zero_rpo_requires_active_active
    priority: 1
    if:
      - rpo_requirement in [zero, seconds]
      - rto_requirement in [zero, seconds]
      - budget in [moderate, generous]
    then:
      pattern: active_active_multi_region
      standards:
        - "Active-Active Architecture"
      notes: "Near-zero RPO/RTO requires active-active multi-region with synchronous replication and global load balancing"

  - id: minutes_rto_uses_warm_standby
    priority: 2
    if:
      - rpo_requirement in [minutes, seconds]
      - rto_requirement in [minutes, seconds]
      - budget in [moderate, generous]
    then:
      pattern: warm_standby
      standards:
        - "Multi-AZ / Cross-Region Standby"
      notes: "Warm standby provides minutes-level DR with a pre-provisioned scaled-down copy in the secondary region"

  - id: hours_rpo_uses_pilot_light
    priority: 3
    if:
      - rpo_requirement in [minutes, hours]
      - rto_requirement in [minutes, hours]
      - budget == moderate
    then:
      pattern: pilot_light
      standards:
        - "Pilot Light DR"
      notes: "Pilot light replicates data and core services to secondary region with minimal running footprint"

  - id: minimal_budget_uses_backup_restore
    priority: 4
    if:
      - budget == minimal
      - rpo_requirement in [hours, days]
      - rto_requirement in [hours, days]
    then:
      pattern: backup_restore
      standards:
        - "3-2-1 Backup Rule"
      notes: "Minimal budget DR uses periodic backups with data restoration — highest RPO/RTO but lowest cost"

  - id: strict_compliance_needs_cross_region
    priority: 5
    if:
      - compliance_requirements == strict
    then:
      pattern: active_active_multi_region
      standards:
        - "Compliance Data Residency"
      notes: "Strict compliance often mandates cross-region replication with data residency guarantees"

decision_metadata:
  confidence: high
  risk_if_wrong: critical
  fallback:
    pattern: backup_restore
    description: "Periodic backups to separate region — universal starting point for DR"

patterns:
  - id: backup_restore
    name: Backup-Restore Strategy
    description: >
      The most basic DR strategy. Data is backed up periodically to
      durable storage (S3, blob storage, tape) in a separate region.
      On disaster, infrastructure is provisioned and data is restored
      from backup. Highest RPO/RTO but lowest cost.

    use_when:
      - "Budget is constrained — no funds for hot standby"
      - "RPO of hours to days is acceptable"
      - "RTO of hours to days is acceptable"
      - "Data changes slowly and infrequently"

    avoid_when:
      - "Any data loss is unacceptable (RPO must be zero)"
      - "Recovery must happen in minutes or less"
      - "System serves critical real-time traffic"

    tradeoffs:
      pros:
        - "Lowest cost — pay only for backup storage"
        - "Simple to implement and test"
        - "Works across any cloud or on-premises"
        - "Backups useful for non-DR purposes (audit, debug, migration)"
      cons:
        - "Highest RPO (up to previous backup time)"
        - "Highest RTO (provision + restore can take hours)"
        - "No automated failover — manual recovery process"
        - "Restore reliability depends on backup testing discipline"

    implementation:
      guidelines:
        - "Follow 3-2-1 rule: 3 copies, 2 media types, 1 off-site"
        - "Automate backup scheduling with monitoring and alerting"
        - "Encrypt backups at rest — use provider-managed KMS"
        - "Test restore process at least quarterly — untested backup is not a backup"
        - "Use incremental backups with periodic full backups (weekly/monthly)"
        - "Set backup retention policy matching compliance and business needs"
        - "Automate DR runbook — document every step for rapid restore"

      common_errors:
        - error: "Never testing backup restoration"
          impact: "Backup is corrupt; production data lost permanently"
          fix: "Test full restore quarterly; automate restore validation scripts"
        - error: "Backups stored in same region as production"
          impact: "Regional disaster destroys both production and backups"
          fix: "Replicate backups to separate region; follow 3-2-1 rule"
        - error: "No backup encryption"
          impact: "Data breach if backup storage is compromised"
          fix: "Encrypt all backups at rest using KMS-managed keys"

    maturity:
      level: standard

    standards:
      - name: 3-2-1 Backup Rule
        type: practice
        role: "Standard backup redundancy strategy"
        status: recommended
      - name: Automated Restore Testing
        type: practice
        role: "Validating backup integrity through automated recovery drills"
        status: recommended

  - id: pilot_light
    name: Pilot Light
    description: >
      Core data and critical services are continuously replicated to a
      secondary region. The secondary region runs minimal infrastructure
      (database replicas, core networking). On failover, non-critical
      services are scaled up from the pilot light configuration. Balances
      cost with recovery speed.

    use_when:
      - "Minutes to hours RTO acceptable"
      - "Moderate DR budget available"
      - "Core business functions must resume quickly"
      - "Need cost-efficient DR for non-critical services"

    avoid_when:
      - "RTO must be under 5 minutes"
      - "No budget for any standby infrastructure"
      - "All services are equally critical (warm standby may be better)"

    tradeoffs:
      pros:
        - "Lower cost than warm standby (only core infra runs)"
        - "Minutes-scale RTO for critical services"
        - "Data continuously replicated (low RPO)"
        - "Good balance of cost and recovery speed"
      cons:
        - "Non-critical services take longer to recover"
        - "Manual scaling during failover increases RTO"
        - "Still requires operational playbook and practice"
        - "Not suitable for zero-downtime requirements"

    implementation:
      guidelines:
        - "Identify core services that must run in pilot light configuration"
        - "Replicate data continuously (async DB replication, S3 CRR)"
        - "Keep a scaled-down copy of infra stack (smaller instances, fewer AZs)"
        - "Use infrastructure-as-code to scale up secondary region quickly"
        - "Create and practice failover runbook regularly (quarterly drills)"
        - "Automate DNS failover (Route 53 health checks, failover routing)"

      common_errors:
        - error: "Pilot light too small to handle production load"
          impact: "Failover to secondary region but infra is undersized — capacity crash"
          fix: "Right-size pilot light to handle at least 50% production load; auto-scale on failover"
        - error: "Outdated IaC templates for secondary region"
          impact: "Scale-up fails because templates don't match current infrastructure"
          fix: "Deploy IaC changes to both regions simultaneously; test scale-up in drills"
        - error: "Not practicing failover regularly"
          impact: "First actual failover takes 4x expected time; manual steps forgotten"
          fix: "Quarterly failover drills with documented results and improvement plans"

    maturity:
      level: advanced

    standards:
      - name: Pilot Light DR
        type: practice
        role: "Minimal secondary region with core services only"
        status: recommended
        reference: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html"

  - id: warm_standby
    name: Warm Standby
    description: >
      A fully-provisioned but scaled-down copy of the production
      environment runs in a secondary region. On failover, instances
      are scaled up to full capacity and DNS is switched. Provides
      minutes-scale recovery with moderate cost.

    use_when:
      - "RTO of minutes required (5-30 minutes)"
      - "RPO of seconds to minutes required"
      - "Moderate to generous DR budget"
      - "All services need relatively fast recovery"

    avoid_when:
      - "Zero RTO/RPO required (use active-active)"
      - "Budget cannot support a second scaled-down environment"
      - "Application cannot run in degraded mode during scale-up"

    tradeoffs:
      pros:
        - "Minutes-scale RTO — infra already provisioned"
        - "Seconds to minutes RPO — data replicated continuously"
        - "Can serve read traffic in secondary region (useful investment)"
        - "Scaling up is faster than provisioning from scratch"
      cons:
        - "Cost of running secondary infra (50-70% of production cost)"
        - "Data replication lag — some data loss possible if async"
        - "Still requires DNS failover and scale-up orchestration"
        - "Complexity of keeping both environments in sync"

    implementation:
      guidelines:
        - "Run secondary region at 25-50% of production capacity"
        - "Use async database replication (cross-region read replicas)"
        - "Automate DNS failover with health check probes"
        - "Pre-warm AMIs/container images in secondary region"
        - "Test scaling up from warm to full capacity in drills"
        - "Use auto-scaling groups to handle the scale-up automatically"
        - "Validate application functionality in secondary region regularly"

      common_errors:
        - error: "DR environment config drifts from production"
          impact: "Failover succeeds but app fails due to config differences"
          fix: "Deploy all changes to both regions; automate config validation"
        - error: "Replication lag not monitored"
          impact: "Failover causes unexpected data loss because replication was hours behind"
          fix: "Monitor replication lag; alert if lag exceeds RPO; switch to sync if needed"
        - error: "Warm standby too scaled down to meaningfully test"
          impact: "Smaller scale masks performance issues that surface during actual failover"
          fix: "Run at 25-50% of production scale; test scale-up path in drills"

    maturity:
      level: advanced

    standards:
      - name: Warm Standby DR
        type: practice
        role: "Partially-provisioned DR region with async replication"
        status: recommended
        reference: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/warm-standby.html"

  - id: active_active_multi_region
    name: Active-Active Multi-Region
    description: >
      Production workload runs simultaneously in two or more regions.
      Traffic is distributed via global load balancer. Data is replicated
      synchronously or asynchronously between regions. Provides the
      lowest RPO/RTO but at the highest cost and complexity.

    use_when:
      - "Near-zero RPO/RTO required (seconds or less)"
      - "Business cannot tolerate any downtime"
      - "Global user base needing low latency worldwide"
      - "Generous DR budget"
      - "Compliance requiring data residency in multiple regions"

    avoid_when:
      - "Application is not designed for multi-region consistency"
      - "Budget is limited (2x+ infrastructure cost)"
      - "Single-region availability meets requirements (99.99%+)"
      - "Data consistency across regions is unsolvable for the workload"

    tradeoffs:
      pros:
        - "Lowest RPO (near-zero with sync replication)"
        - "Lowest RTO (automatic failover via global LB health checks)"
        - "Improved latency for global users"
        - "Survives entire region failure without downtime"
        - "Can serve traffic from all regions (no idle resources)"
      cons:
        - "2x+ infrastructure cost"
        - "Significant operational complexity"
        - "Data consistency challenges (CAP theorem constraints)"
        - "Application must be designed for multi-region from the start"
        - "Compliance and data sovereignty require careful treatment"

    implementation:
      guidelines:
        - "Use global load balancer with health-based failover (Route 53, CloudFront, GCLB)"
        - "Synchronous replication for critical data; async for non-critical"
        - "Design for conflict resolution: last-writer-wins, CRDTs, or application-level merge"
        - "Use active-active only for stateless or eventually-consistent workloads"
        - "Implement circuit breakers for cross-region calls"
        - "Test regional failover regularly with production traffic"
        - "Monitor cross-region replication lag as primary health metric"

      common_errors:
        - error: "Synchronous replication across distant regions"
          impact: "Write latency increases by round-trip time (100-300ms); throughput drops"
          fix: "Use async for most data; sync only within region; use optimistic replication patterns"
        - error: "No conflict resolution strategy"
          impact: "Data inconsistency when both regions concurrently update the same record"
          fix: "Use conflict-free data types (CRDTs) or last-writer-wins with known tradeoffs"
        - error: "Assuming active-active is always cheaper than downtime"
          impact: "2x+ infrastructure cost for workloads that could tolerate minutes of downtime"
          fix: "Evaluate cost of downtime vs. cost of active-active; choose appropriate DR tier"

    maturity:
      level: enterprise

    standards:
      - name: Active-Active Architecture
        type: pattern
        role: "Multi-region workload with active traffic in all regions"
        status: recommended
        reference: "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/active-active.html"

examples:
  - id: 3_2_1_backup_policy
    title: "3-2-1 Backup Strategy Implementation"
    context: "Database backup policy for production workload"
    correct: |
      # 3-2-1 Backup Policy for Production Database
      # 3 copies: production, local backup, remote backup

      # Daily backup to local storage (same-region)
      # 35-day retention for point-in-time recovery
      0 2 * * * pg_dump --format=custom --compress=9 \
        --file=s3://prod-backups-local/db/daily_$(date +%Y%m%d).dump \
        --host=prod-db.internal

      # Weekly cross-region replication (different region)
      # 12-month retention for compliance
      0 3 * * 0 aws s3 sync s3://prod-backups-local/db/ \
        s3://prod-backups-dr/db/ --storage-class GLACIER

      # Monthly archive (different media — Glacier)
      # 7-year retention for audit
      0 4 1 * * aws s3 cp s3://prod-backups-dr/db/monthly_$(date +%Y%m).dump \
        s3://prod-backups-archive/db/ --storage-class DEEP_ARCHIVE
    incorrect: |
      # WRONG: Single copy, same region, no encryption
      # Single backup to local disk — one fire destroys everything
      0 2 * * * pg_dump mydb > /var/backups/db/daily.sql
    explanation: >
      The correct version implements the 3-2-1 rule: 3 copies, 2 storage
      tiers (S3, Glacier), 1 off-site (cross-region). The incorrect version
      stores a single unencrypted backup on local disk — no protection
      against hardware failure, fire, or regional disaster.

  - id: pilot_light_failover
    title: "Pilot Light Failover Runbook"
    context: "Failover from primary to secondary region"
    correct: |
      # Pilot Light Failover Runbook

      1. DETECT: Health check fails for primary region
      2. DECIDE: On-call engineer confirms disaster (5 min)
      3. PROMOTE: Promote read replica to primary database
         - aws rds promote-read-replica --db-instance-identifier dr-db
      4. SCALE: Scale up pilot light compute to full capacity
         - aws autoscaling update-auto-scaling-group --min-size 10 --max-size 50
      5. VERIFY: Run health checks on DR stack
         - curl https://dr-api.internal/health
      6. SWITCH: Update DNS to point to DR region
         - Route 53 health check detects primary failure
         - Fails over to secondary region automatically
      7. COMMUNICATE: Notify stakeholders of failover
      8. MONITOR: Track DR performance until primary restored
    incorrect: |
      # WRONG: No runbook — everyone figures it out during the disaster
      # Step 1: Panic
      # Step 2: Someone SSHes into DR instances (if any)
      # Step 3: Try to remember the backup location
      # Step 4: ...
    explanation: >
      A documented, tested runbook is essential for DR. The correct version
      shows a clear step-by-step failover sequence with automated steps
      and verification. Without a runbook, recovery time is unpredictable
      and critical steps are forgotten under pressure.

security_hardening:
  transport:
    requirements:
      - "Cross-region replication traffic encrypted with TLS"
      - "Backup transfer uses encrypted channels (HTTPS, TLS, or VPN)"
  data_protection:
    requirements:
      - "All backups encrypted at rest using KMS-managed keys"
      - "Backup encryption keys separate from production keys"
      - "Sensitive data encrypted before backup at application level"
  access_control:
    requirements:
      - "Backup storage access restricted to backup service accounts only"
      - "Cross-region replication authenticated with IAM roles or service accounts"
      - "DR region access audited — only authorized operators can trigger failover"
  input_output:
    requirements:
      - "Backup validation includes integrity checks (checksums, verify utilities)"
      - "Restore scripts validated and version-controlled"
  secrets:
    requirements:
      - "DR environment database credentials stored in secrets manager separately from primary"
      - "Backup encryption keys rotated on schedule with access logging"
  monitoring:
    requirements:
      - "Backup success/failure monitored with alerting on failures"
      - "Replication lag between regions monitored — alert if exceeds RPO"
      - "DR testing scheduled quarterly with results documented"
      - "Failover drills logged and reviewed for improvement"

compliance:
  standards:
    - name: "SOC 2 CC8.1"
      relevance: "Change management and business continuity planning"
    - name: "PCI DSS v4.0 Requirement 3"
      relevance: "Backup and restore for cardholder data"
      reference: "PCI DSS v4.0 Requirement 3.5"
    - name: "GDPR Article 32"
      relevance: "Security of processing — backup and recovery capabilities"
      reference: "GDPR Article 32"
    - name: "ISO 27001 A.12.3"
      relevance: "Backup policy and procedures"

  requirements_mapping:
    - control: backup_encryption
      description: "All backups encrypted at rest with managed keys"
      maps_to:
        - "PCI DSS Requirement 3.5"
        - "ISO 27001 A.10.1"
    - control: dr_testing
      description: "DR plan tested at least annually with documented results"
      maps_to:
        - "SOC 2 CC8.1"
        - "ISO 27001 A.17.1"
    - control: backup_replication
      description: "Backups stored in separate geographic location"
      maps_to:
        - "GDPR Article 32"
        - "PCI DSS Requirement 3.5"

prompt_recipes:
  - id: greenfield_dr
    scenario: greenfield
    description: "Design DR strategy for a new workload"
    prompt: |
      Design a disaster recovery strategy for a new workload.

      Context:
      - RPO requirement: [zero/seconds/minutes/hours/days]
      - RTO requirement: [zero/seconds/minutes/hours/days]
      - DR budget: [minimal/moderate/generous]
      - Compliance requirements: [none/standard/strict]

      Requirements:
      1. Choose DR tier: backup-restore, pilot light, warm standby, or active-active
      2. Design data replication strategy (sync vs async)
      3. Define backup policy (3-2-1 rule, retention, encryption)
      4. Create failover runbook with automation
      5. Plan DR testing schedule (quarterly at minimum)
      6. Document monitoring and alerting for DR readiness

  - id: audit_dr
    scenario: audit
    description: "Audit disaster recovery readiness"
    prompt: |
      Audit disaster recovery readiness:

      1. Is the DR tier appropriate for RPO/RTO requirements?
      2. Are backups encrypted and stored in a separate region?
      3. Has a full restore been tested in the last 6 months?
      4. Is there a documented and tested failover runbook?
      5. Is replication lag monitored with alerting?
      6. Are DR credentials managed separately from primary?
      7. Is there a rollback plan for failed failover?
      8. Are DR drills scheduled and documented?

  - id: migration_dr
    scenario: migration
    description: "Upgrade DR from backup-restore to warm standby"
    prompt: |
      Plan DR upgrade from backup-restore to warm standby.

      Current: Periodic backups to secondary region; RPO=24h, RTO=24h
      Target: Warm standby with async replication; RPO=5min, RTO=15min

      Migration steps:
      1. Provision secondary region infrastructure (scaled down)
      2. Set up continuous data replication (async)
      3. Configure monitoring for replication lag
      4. Create automated scale-up scripts
      5. Write and validate failover runbook
      6. Test failover in non-production first
      7. Switch backup-restore to warm standby in production
      8. Document rollback path to backup-restore

  - id: debugging_failed_restore
    scenario: debugging
    description: "Debug backup restore failure"
    prompt: |
      Debug a backup restore failure.

      Symptoms: Restore from backup fails (corrupt file, missing data,
      schema mismatch).

      Investigation:
      1. Check backup file integrity (checksum verification)
      2. Verify backup tool version matches restore tool version
      3. Check schema compatibility between backup and target
      4. Review backup logs for errors at time of creation
      5. Test restore of older backup to narrow down issue

      Fixes:
      - Re-run restore from different backup copy
      - Document root cause and update runbook
      - Add pre-restore validation step to runbook
      - Review and improve backup monitoring

  - id: high_security_dr
    scenario: architecture
    description: "Design DR for PCI/GDPR regulated environment"
    prompt: |
      Design DR strategy for a regulated environment.

      Constraints:
      - Encrypted backups at rest and in transit
      - Cross-region data replication compliant with data residency
      - Audit trail of all DR operations
      - Access to DR environment restricted and logged
      - Backups retainable for 7 years (regulatory)

      Design:
      1. Backup encryption with separate KMS key per region
      2. Cross-region replication with VPC peering and encrypted endpoints
      3. Failover runbook with approval gates for auditors
      4. Quarterly failover drills with documented results
      5. Backup lifecycle: daily (35d), weekly (12mo), monthly (7yr)

anti_patterns:
  - name: "Untested Backups"
    description: >
      Creating backups regularly but never testing the restore process.
      When disaster strikes, the backup is found to be corrupt or the
      restore process fails due to environment drift.
    fix: "Test full restore quarterly; automate validation scripts; simulate disaster scenarios"
    severity: critical
    related_pattern: backup_restore

  - name: "Single-Region Backups"
    description: >
      Storing all backups in the same region as production. A regional
      disaster destroys both the primary workload and its backups,
      leaving no recovery path.
    fix: "Replicate backups to a separate region; follow 3-2-1 backup rule"
    severity: critical
    related_pattern: backup_restore

  - name: "Pilot Light Too Dim"
    description: >
      Running pilot light at such a minimal footprint that scaling to
      production capacity takes hours. The scale-up path is untested
      and the IaC templates are out of sync with production.
    fix: "Right-size pilot light for 50% of production; test scale-up quarterly; keep IaC synced"
    severity: high
    related_pattern: pilot_light

  - name: "No Rollback Plan for Failover"
    description: >
      If failover causes worse issues than the original disaster, there
      is no documented plan to fail back to the primary region. The
      team must improvise under extreme pressure.
    fix: "Document and test failback runbook alongside failover runbook"
    severity: high
    related_pattern: active_active_multi_region

