# =============================================================================
# AI Architecture Cookbook — Workflow Orchestration
# Schema: v3 | Domain: workflow-orchestration
# =============================================================================

meta:
  schema_version: 3
  domain: workflow-orchestration
  version: "1.0.0"
  last_updated: "2026-06-04"
  description: >
    Workflow orchestration patterns for coordinating multi-step business processes.
    Covers choreography/saga, state machine workflows, Temporal-based orchestration,
    and BPMN/Camunda for human-in-the-loop processes.

  tags:
    - workflow
    - orchestration
    - saga
    - temporal
    - camunda
    - state-machine
    - bpmn

  categories:
    - application-architecture

  prerequisites:
    - messaging-events
    - error-handling
    - state-management

  related_standards:
    - id: messaging-events
      relationship: complementary
      context: "Choreography-based sagas rely on event-driven communication between services"
    - id: error-handling
      relationship: complementary
      context: "Workflow failure modes require structured error handling and compensation"

context_inputs:
  - name: workflow_complexity
    type: enum
    description: "How complex is the workflow logic (branches, parallel steps, conditional paths)?"
    required: true
    default: moderate
    enum_values:
      - simple
      - moderate
      - complex

  - name: state_persistence_need
    type: boolean
    description: "Does workflow state need to survive service restarts?"
    required: true
    default: true

  - name: human_tasks_included
    type: boolean
    description: "Does the workflow require human approval or intervention steps?"
    required: true
    default: false

  - name: execution_duration
    type: enum
    description: "Expected duration of the workflow execution"
    required: true
    default: seconds
    enum_values:
      - seconds
      - minutes
      - hours
      - days

  - name: rollback_requirement
    type: boolean
    description: "Does the workflow need to support rollback/compensation?"
    required: true
    default: false

decision_tree:
  - id: human_tasks_require_bpmn
    priority: 1
    if:
      - human_tasks_included == true
    then:
      pattern: bpmn_camunda
      standards:
        - "BPMN 2.0 Specification"
      notes: "Human-in-the-loop workflows require BPMN for task assignment, deadlines, and escalations"

  - id: long_running_with_rollback_requires_temporal
    priority: 2
    if:
      - execution_duration in [hours, days]
      - rollback_requirement == true
    then:
      pattern: temporal_orchestration
      standards:
        - "Temporal Workflow Engine"
      notes: "Long-running workflows with rollback need persistent orchestration with compensation support"

  - id: simple_workflow_without_state_uses_choreography
    priority: 3
    if:
      - workflow_complexity == simple
      - state_persistence_need == false
    then:
      pattern: choreography_saga
      standards:
        - "Saga Pattern (Hector & Marick, 1987)"
      notes: "Simple workflows without state persistence are well-served by event-driven saga choreography"

  - id: moderate_complexity_with_state_uses_state_machine
    priority: 4
    if:
      - workflow_complexity in [simple, moderate]
      - state_persistence_need == true
    then:
      pattern: state_machine
      standards:
        - "State Machine Pattern"
      notes: "Persistent state machines handle moderate complexity with clear state transitions"

  - id: complex_workflow_with_state_requires_temporal
    priority: 5
    if:
      - workflow_complexity == complex
      - state_persistence_need == true
    then:
      pattern: temporal_orchestration
      standards:
        - "Temporal Workflow Engine"
      notes: "Complex workflows with state persistence require a dedicated orchestration engine"

decision_metadata:
  confidence: high
  risk_if_wrong: high
  fallback:
    pattern: state_machine
    description: "State machine pattern is the safest default for most workflow needs"

patterns:
  - id: choreography_saga
    name: "Choreography/Saga Pattern"
    description: >
      Distributed transaction pattern where each service in a saga publishes events
      after completing its step. Other services listen for events and execute their
      own steps or compensating transactions. No central coordinator.
    use_when:
      - "Simple, linear workflows with few participants"
      - "Existing event-driven architecture already in place"
      - "No need for centralized workflow visibility"
      - "Teams own their services end-to-end"
    avoid_when:
      - "Complex workflows with branching and parallel paths"
      - "Need for centralized monitoring and management"
      - "Human tasks and deadlines require active management"
      - "Debugging cross-service workflows is frequent"
    tradeoffs:
      pros:
        - "No central coordinator — reduces single point of failure"
        - "Loosely coupled — services only depend on event schema"
        - "Natural fit for event-driven architectures"
        - "Easy to add new participants without coordinator changes"
      cons:
        - "Hard to trace and debug — workflow logic distributed across services"
        - "Implicit workflow — no single view of overall state"
        - "Difficult to add compensating steps retroactively"
        - "Service coupling via shared event schemas"
    implementation:
      guidelines:
        - "Each step publishes a domain event on completion (e.g., OrderCreated)"
        - "Listeners execute the next step or trigger compensation events"
        - "Implement idempotent event handlers — same event may be delivered twice"
        - "Use a dead-letter queue for events that fail all retry attempts"
        - "Track saga state with a correlation ID flowing through all events"
      common_errors:
        - error: "No compensation events defined for failure scenarios"
          impact: "Partial saga completion with no rollback — data inconsistency"
          fix: "For every forward event, define a compensation event with idempotent handling"
        - error: "Non-idempotent event handlers"
          impact: "Duplicate events cause double-processing and data corruption"
          fix: "Implement idempotency keys and deduplication for every event handler"
        - error: "No dead-letter or timeout handling for stuck sagas"
          impact: "Sagas hang indefinitely on unresponsive services"
          fix: "Implement saga timeout with automatic compensation on timeout expiry"
    maturity:
      level: advanced
    standards:
      - name: "Saga Pattern (Hector & Marick, 1987)"
        type: pattern
        role: "Original saga distributed transaction pattern"
        status: recommended

  - id: state_machine
    name: "State Machine Workflow"
    description: >
      Model workflow as a finite state machine with defined states, transitions,
      and side effects per transition. State is persisted for durability and
      recovery. Suitable for moderate-complexity business processes.
    use_when:
      - "Workflow state must survive service restarts"
      - "Clear, enumerable states with defined transitions"
      - "Moderate complexity with branching paths"
      - "Need for explicit workflow state visibility"
    avoid_when:
      - "Very long-running workflows (hours/days) requiring durable timers"
      - "Complex human task management with deadlines and escalations"
      - "Simple fire-and-forget where choreography suffices"
    tradeoffs:
      pros:
        - "Explicit state model — clear visibility into current step"
        - "Transactions enforce valid transitions — invalid moves are impossible"
        - "Persistent state survives restarts and failures"
        - "Easy to test — each state and transition is independently verifiable"
      cons:
        - "State explosion — complex workflows need many states"
        - "No built-in timer/schedule management"
        - "Manual compensation logic for rollback scenarios"
        - "Scaling state machines across services requires distributed state"
    implementation:
      guidelines:
        - "Define states, transitions, and side effects as code (statechart library)"
        - "Persist state to a database between transitions for crash recovery"
        - "Use a reliable state store (PostgreSQL, Redis) with optimistic locking"
        - "Log every state transition with before/after state and payload"
        - "Implement timeout states for stalled workflows"
      common_errors:
        - error: "Mutable state objects modified outside the state machine"
          impact: "State transitions bypass validation; inconsistent workflow state"
          fix: "Enforce all state access through the state machine interface — no direct mutation"
        - error: "Missing error states for failure paths"
          impact: "Workflow enters an invalid state on error and cannot recover"
          fix: "Include explicit error, retry, and failure states for every transition"
        - error: "State machine not persisted — in-memory only"
          impact: "Crash loses all in-progress workflow state"
          fix: "Persist every state transition atomically; recover active workflows on startup"
    maturity:
      level: standard
    standards:
      - name: "Finite State Machine Pattern"
        type: pattern
        role: "Core state machine pattern for workflow modeling"
        status: recommended

  - id: temporal_orchestration
    name: "Orchestration with Temporal"
    description: >
      Use a workflow engine (Temporal) to define workflows as code with built-in
      durability, retries, timers, and compensation. Workflows execute reliably
      even across service restarts and infrastructure failures.
    use_when:
      - "Long-running workflows with durable execution guarantees"
      - "Complex workflows with branching, parallelism, and rollback needs"
      - "Need for reliable timers and schedules"
      - "Workflow must survive service restarts and failures"
    avoid_when:
      - "Simple fire-and-forget workflows"
      - "Team lacks operational experience with workflow engines"
      - "Workflow engine infrastructure is not available or approved"
    tradeoffs:
      pros:
        - "Durable execution — workflow survives process crashes"
        - "Built-in retry, timeout, and compensation mechanisms"
        - "Workflow-as-code — business logic in your language"
        - "Excellent observability — web UI and event history"
      cons:
        - "Infrastructure complexity — need to run Temporal Server"
        - "Learning curve — workflow engine concepts are new to most teams"
        - "Debugging workflow replay is tricky"
        - "Versioning workflows requires careful migration planning"
    implementation:
      guidelines:
        - "Write workflows as deterministic code — no random, time, or side effects in workflow functions"
        - "Use activities for all side effects (network calls, database operations)"
        - "Set activity retry policies with exponential backoff"
        - "Implement signal handlers for external inputs and cancellations"
        - "Version workflows using patch markers when logic changes"
      common_errors:
        - error: "Non-deterministic workflow code (random, system clock, direct I/O)"
          impact: "Workflow replay produces different results; execution breaks"
          fix: "Use Temporal SDK functions for time, randomness; all I/O goes through activities"
        - error: "No timeout on activities — workflow hangs forever"
          impact: "Stuck workflows consume resources and block dependent processes"
          fix: "Always set activity start-to-close and schedule-to-close timeouts"
        - error: "One massive workflow instead of composing smaller workflows"
          impact: "Single workflow handles too many concerns; hard to test and version"
          fix: "Decompose into child workflows; each child has a single responsibility"
    maturity:
      level: enterprise
    standards:
      - name: "Temporal Workflow Engine"
        type: tool
        role: "Durable workflow execution platform"
        status: recommended
        reference: "https://temporal.io/"

  - id: bpmn_camunda
    name: "BPMN/Camunda Orchestration"
    description: >
      Model workflows visually using BPMN 2.0 diagrams executed by an engine
      (Camunda, Zeebe). Best for human-in-the-loop processes with task assignment,
      deadlines, escalations, and audit trails visible to business users.
    use_when:
      - "Human tasks with assignment, deadlines, and escalation chains"
      - "Business users need visibility into workflow state"
      - "Compliance-driven processes requiring audit trails"
      - "Processes modeled and reviewed by non-technical stakeholders"
    avoid_when:
      - "All-automated workflows with no human interaction"
      - "Rapidly changing workflows — BPMN model updates require deployment"
      - "Team prefers code over visual modeling"
    tradeoffs:
      pros:
        - "Visual process models accessible to business stakeholders"
        - "Built-in human task management with deadlines and escalations"
        - "Full audit trail of every process execution"
        - "Standardized notation — BPMN 2.0 is industry standard"
      cons:
        - "Graphical modeling adds overhead for simple workflows"
        - "Versioning BPMN diagrams in source control requires discipline"
        - "Development speed slower than code-based alternatives"
        - "Engine infrastructure adds operational complexity"
    implementation:
      guidelines:
        - "Model the happy path fully automated processes in BPMN"
        - "Use boundary error events for exception handling at each step"
        - "Define escalation boundaries with timer events on human tasks"
        - "Implement correlation keys for message-based process routing"
        - "Store BPMN diagrams in version control alongside application code"
      common_errors:
        - error: "BPMN diagrams not version-controlled"
          impact: "Cannot track who changed what; deployment mismatches between envs"
          fix: "Store all BPMN models as XML files in Git alongside application code"
        - error: "Modeling implementation details in BPMN instead of business logic"
          impact: "Diagrams become too detailed for business comprehension; hard to maintain"
          fix: "Model at the business process level; implement technical details in service tasks"
        - error: "No error handling — no boundary events on any task"
          impact: "Any service failure collapses the entire process instance"
          fix: "Add error boundary events to every automated service task"
    maturity:
      level: enterprise
    standards:
      - name: "BPMN 2.0"
        type: standard
        role: "Business Process Model and Notation standard"
        status: recommended
        reference: "https://www.omg.org/spec/BPMN/2.0/"
      - name: "Camunda Platform 8"
        type: tool
        role: "BPMN workflow engine"
        status: recommended

examples:
  - id: saga_compensation_example
    title: "Saga with Compensation — Order Flow"
    context: "Distributed order processing with rollback on failure"
    correct: |
      # Step 1: Reserve Inventory
      def handle_inventory_reserved(event):
          try:
              process_payment(event.order_id, event.total)
              payment_events.publish(PaymentProcessed(order_id=event.order_id))
          except PaymentFailed:
              # Compensation: release inventory reservation
              inventory_events.publish(InventoryReleased(order_id=event.order_id))
              saga_events.publish(OrderFailed(order_id=event.order_id))

      # Each event has a compensation counterpart
      # Compensation events are idempotent
    incorrect: |
      # No compensation — partial state on failure
      def handle_inventory_reserved(event):
          result = process_payment(event.order_id, event.total)
          if not result.success:
              raise RuntimeError("Payment failed")
              # Inventory stays reserved forever
    explanation: >
      Every saga step must define a compensating action for the inverse operation.
      Without compensation, a payment failure leaves inventory permanently locked.

  - id: temporal_workflow
    title: "Temporal Workflow — Order Fulfillment"
    context: "Long-running order fulfillment with retries and timeout"
    correct: |
      # Deterministic workflow function
      def order_fulfillment_workflow(ctx, order_id):
          # Activities do all I/O
          inventory_result = yield ctx.execute_activity(
              reserve_inventory, order_id,
              start_to_close_timeout="10s",
              retry_policy=RetryPolicy(max_attempts=3)
          )
          if not inventory_result.reserved:
              return OrderResult(status="failed")

          with yield ctx.new_timer("payment_timeout", "30m"):
              payment_result = yield ctx.execute_activity(
                  process_payment, order_id,
                  start_to_close_timeout="5s"
              )
    incorrect: |
      # Non-deterministic — direct I/O in workflow
      def order_fulfillment_workflow(ctx, order_id):
          # WRONG: direct network call in workflow function
          inventory = requests.post(".../reserve", data=order_id)
          # Replay will produce different results
    explanation: >
      Temporal workflow functions must be deterministic — all I/O and side effects
      must run in activities. Direct network calls in workflow functions break
      replay and cause execution failures.

security_hardening:
  transport:
    requirements:
      - "TLS 1.2+ for all inter-service communication in workflow steps"
      - "Workflow engine API endpoints behind authenticated gateways"
  data_protection:
    requirements:
      - "Workflow state serialized without sensitive data (PII, secrets)"
      - "Compensation events preserve data integrity across rollbacks"
      - "Workflow logs redact sensitive payload fields"
  access_control:
    requirements:
      - "Workflow execution identity isolated per tenant or service boundary"
      - "Human task assignment authenticated against identity provider"
      - "Workflow cancellation requires elevated permissions"
  input_output:
    requirements:
      - "All workflow inputs validated before state transitions"
      - "Event payloads sanitized for injection attacks"
      - "Signal inputs (Temporal) validated before processing"
  secrets:
    requirements:
      - "Activity implementations use secrets manager, never workflow code"
      - "Workflow engine credentials stored in secrets manager"
      - "API keys for external services in activities retrieved at runtime"
  monitoring:
    requirements:
      - "All state transitions logged with correlation ID and timestamp"
      - "Alert on workflow timeout or exceeding retry limits"
      - "Dead-letter queue events trigger immediate notification"

compliance:
  standards:
    - name: "SOX (Sarbanes-Oxley)"
      relevance: "Human-in-the-loop workflows require audit trails for financial controls"
    - name: "GDPR"
      relevance: "Workflow compensation must handle personal data deletion requests"
    - name: "ISO 27001"
      relevance: "Workflow orchestration controls map to A.12.6 (Technical Vulnerability Management)"

  requirements_mapping:
    - control: workflow_audit_trail
      description: "Every workflow state transition logged with before/after state and actor"
      maps_to:
        - "SOX Section 404 — Internal Controls"
    - control: human_task_segregation
      description: "Human task assignment enforces separation of duties"
      maps_to:
        - "SOX Section 302 — Corporate Responsibility"

prompt_recipes:
  - id: wo_greenfield
    scenario: greenfield
    description: "Design workflow orchestration for a new business process"
    prompt: |
      Design a workflow orchestration for {process_description}.

      Workflow complexity: {workflow_complexity}
      State persistence needed: {state_persistence_need}
      Human tasks included: {human_tasks_included}
      Execution duration: {execution_duration}
      Rollback required: {rollback_requirement}

      1. Choose orchestration pattern based on complexity and duration
      2. Define workflow states and valid transitions
      3. Design compensation/rollback for failure scenarios
      4. Plan timeout and retry policies per step
      5. Implement state persistence strategy

  - id: wo_audit
    scenario: audit
    description: "Audit workflow implementation for resilience"
    prompt: |
      Audit this workflow implementation for resilience gaps:

      {workflow_details}

      Check for:
      1. Are all state transitions persisted atomically?
      2. Are compensating actions defined for each forward step?
      3. Are activity timeouts configured (not infinite)?
      4. Does the workflow survive service restarts?
      5. Are idempotency keys on all event handlers?
      6. Is there a dead-letter queue for unprocessable events?
      7. Are timeout and error states explicitly modeled?

  - id: wo_migration
    scenario: migration
    description: "Migrate from choreography to orchestrated workflow"
    prompt: |
      Plan migration from choreography-based saga to orchestrated workflow.

      Current: {current_choreography_description}
      Target engine: {target_engine}

      Migration plan:
      1. Extract implicit workflow logic from event handlers
      2. Define explicit workflow states and transitions
      3. Implement orchestrated version alongside existing handlers
      4. Dual-write during transition period
      5. Migrate event handlers to be activity implementations
      6. Decommission old event-based routing

  - id: wo_edge_case
    scenario: edge-case
    description: "Handle partial workflow failure scenarios"
    prompt: |
      Design failure handling for a workflow with partial completion.

      Workflow: {workflow_description}
      Failure point: {failure_scenario}

      Design:
      1. Detect the partial success state
      2. Trigger compensating actions for completed steps
      3. Prevent duplicate compensation (idempotency)
      4. Notify operators of inconsistent state
      5. Provide manual recovery path for edge cases

  - id: wo_high_security
    scenario: high-security
    description: "Harden workflow engine for production security"
    prompt: |
      Harden this workflow engine deployment for production.

      Engine: {workflow_engine}
      Compliance: {compliance_requirements}

      Controls:
      1. Workflow engine API authentication
      2. Encrypted workflow state storage
      3. Audit logging for all workflow operations
      4. Worker identity isolation
      5. Signed workflow definitions
      6. Rate limiting on workflow API

anti_patterns:
  - name: "Distributed God Class Workflow"
    description: >
      One massive workflow that orchestrates every step of every business process.
      Becomes brittle, hard to version, and any change risks breaking multiple
      business flows.
    fix: "Decompose into focused child workflows; one workflow per business process"
    severity: high
    related_pattern: temporal_orchestration

  - name: "Fire-and-Forget Saga"
    description: >
      Starting a saga and never monitoring its completion. Failed sagas leave
      the system in an inconsistent state with no detection or recovery.
    fix: "Implement saga completion tracking, timeout monitoring, and alerting"
    severity: critical
    related_pattern: choreography_saga

  - name: "State Machine Without Persistence"
    description: >
      Modeling workflows as in-memory state machines that lose all state on
      process restart. Any service restart cancels in-progress workflows.
    fix: "Persist state transitions to a database; recover active workflows on startup"
    severity: critical
    related_pattern: state_machine

checklist:
  - id: WO-01
    category: reliability
    description: "Compensating actions defined for every forward workflow step"
    severity: critical
    verified_by: choreography_saga

  - id: WO-02
    category: reliability
    description: "All event handlers are idempotent with deduplication keys"
    severity: critical
    verified_by: choreography_saga

  - id: WO-03
    category: reliability
    description: "Activity timeouts configured on all external calls"
    severity: critical
    verified_by: temporal_orchestration

  - id: WO-04
    category: reliability
    description: "Workflow state persisted and recoverable after service restart"
    severity: high
    verified_by: state_machine

  - id: WO-05
    category: correctness
    description: "State machine enforces valid transitions — invalid transitions rejected"
    severity: high
    verified_by: state_machine

  - id: WO-06
    category: observability
    description: "All state transitions logged with correlation IDs"
    severity: medium
    verified_by: state_machine

  - id: WO-07
    category: design
    description: "Temporal workflows are deterministic — no I/O in workflow functions"
    severity: critical
    verified_by: temporal_orchestration

  - id: WO-08
    category: maintainability
    description: "BPMN diagrams stored in version control alongside code"
    severity: high
    verified_by: bpmn_camunda

  - id: WO-09
    category: design
    description: "Human tasks have deadlines and escalation paths defined"
    severity: high
    verified_by: bpmn_camunda

  - id: WO-10
    category: reliability
    description: "Dead-letter queue configured for unprocessable events"
    severity: high
    verified_by: choreography_saga
