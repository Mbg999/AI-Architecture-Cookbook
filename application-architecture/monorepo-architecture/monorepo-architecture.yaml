# =============================================================================
# AI Architecture Cookbook — Monorepo Architecture
# Schema: v3 | Domain: monorepo-architecture
# =============================================================================

meta:
  schema_version: 3
  domain: monorepo-architecture
  version: "1.0.0"
  last_updated: "2026-06-04"
  description: >
    Monorepo patterns: Nx for large JS/TS, Turborepo for small-medium JS/TS,
    Bazel/Pants for polyglot enterprise, and package-based monorepos with
    pnpm workspaces or Rush. Guidance on code sharing, affected build,
    caching, and incremental CI/CD.

  tags:
    - monorepo
    - nx
    - turborepo
    - rush
    - bazel
    - code-sharing
    - affected-tests

  categories:
    - application-architecture

  prerequisites:
    - ci-cd
    - frontend-build-performance

  related_standards:
    - id: frontend-build-performance
      relationship: complementary
      context: "Monorepo tools optimize build times through caching"
    - id: ci-cd
      relationship: complementary
      context: "Monorepo CI/CD uses affected detection for optimized pipelines"
    - id: micro-frontends
      relationship: complementary
      context: "Monorepo enables shared libs across micro-frontends"

context_inputs:
  - name: repo_size
    type: enum
    description: "Number of projects/packages"
    required: true
    default: small
    enum_values: [small, medium, large, enterprise]

  - name: languages
    type: enum
    description: "Languages used"
    required: true
    default: js_ts_only
    enum_values: [js_ts_only, polyglot, java_kotlin, go_only, python_only]

  - name: need_code_sharing
    type: boolean
    description: "Multiple projects share common libraries?"
    required: true
    default: true

  - name: team_structure
    type: enum
    description: "Team organization"
    required: false
    default: collaborative
    enum_values: [single_team, collaborative, balkanized]

  - name: deployment_model
    type: enum
    description: "Project deployment model"
    required: false
    default: independent
    enum_values: [independent, coordinated, unified]

decision_tree:
  - id: bazel_polyglot
    priority: 1
    if:
      - languages == polyglot
      - repo_size in [large, enterprise]
    then:
      pattern: bazel_pants
      standards: ["Bazel", "Pants"]
      notes: "Polyglot enterprise monorepos benefit from Bazel's language-agnostic build system with distributed caching."

  - id: nx_large_typescript
    priority: 2
    if:
      - languages == js_ts_only
      - repo_size in [large, enterprise]
      - need_code_sharing == true
    then:
      pattern: nx_monorepo
      standards: ["Nx"]
      notes: "Large TypeScript monorepos benefit from Nx's dependency graph, caching, and affected detection."

  - id: turborepo_small_medium
    priority: 3
    if:
      - languages == js_ts_only
      - repo_size in [small, medium]
    then:
      pattern: turborepo
      standards: ["Turborepo"]
      notes: "Small to medium JS/TS: Turborepo's simplicity and minimal config provide fast setup."

  - id: package_based_independent
    priority: 4
    if:
      - deployment_model == independent
      - team_structure in [collaborative, balkanized]
    then:
      pattern: package_based_monorepo
      standards: ["pnpm Workspaces", "Rush"]
      notes: "Independent deployments suit package-based monorepos with per-package versioning."

  - id: small_start
    priority: 5
    if:
      - repo_size == small
    then:
      pattern: turborepo
      notes: "Small repos start with Turborepo; migrate to Nx as complexity grows."

  - id: polyglot_medium
    priority: 6
    if:
      - languages == polyglot
      - repo_size in [small, medium]
    then:
      pattern: package_based_monorepo
      notes: "Medium polyglot projects use package manager workspaces without Bazel's overhead."

decision_metadata:
  confidence: high
  risk_if_wrong: medium
  fallback:
    pattern: turborepo
    description: "Turborepo is the simplest starting point for JS/TS monorepos"

patterns:
  - id: nx_monorepo
    name: "Nx Monorepo"
    description: >
      Comprehensive monorepo build system with dependency graph analysis,
      computation caching, affected project detection, and distributed
      task execution. Supports JS/TS, Go, Python, Rust, Java.
    use_when:
      - "Large codebase with many projects and shared libs"
      - "Need fine-grained affected CI (only build/test changed)"
      - "Multiple frameworks in same repo"
    avoid_when:
      - "Single project with no sharing"
      - "Team unwilling to adopt Nx conventions"
    tradeoffs:
      pros: ["Precise affected dependency graph", "Distributed task execution", "Remote caching (Nx Cloud)"]
      cons: ["Steep learning curve", "Plugin complexity", "Nx Cloud dependency for distributed cache"]
    implementation:
      guidelines:
        - "Configure project.json with explicit targets per project"
        - "Set up affected detection in CI for optimized pipelines"
        - "Use Nx Cloud or self-hosted NCC for distributed caching"
        - "Use tags for module boundary enforcement via ESLint"
        - "Generate projects with nx generate for consistency"
      common_errors:
        - error: "Not tagging libraries for boundary enforcement"
          impact: "Projects import from anywhere; dependency graph is a mess"
          fix: "Use Nx tags and ESLint rules to enforce module boundaries per layer"
        - error: "No remote caching configured"
          impact: "Each CI machine starts cold; no sharing between developers"
          fix: "Set up Nx Cloud or self-hosted remote cache"
    maturity:
      level: enterprise
    standards:
      - name: "Nx"
        type: framework
        role: "Monorepo build system with dependency graph"
        status: recommended

  - id: turborepo
    name: "Turborepo"
    description: >
      Lightweight monorepo build for JS/TS. Task pipelining, local caching,
      parallel execution. Minimal config — works with existing npm scripts.
    use_when:
      - "JS/TS only codebase"
      - "Small to medium repo"
      - "Team wants minimal config"
    avoid_when:
      - "Polyglot codebase"
      - "Enterprise-scale with hundreds of projects"
    tradeoffs:
      pros: ["Minimal configuration", "Fast local caching", "Parallel execution out of box"]
      cons: ["No remote cache included (Vercel paid)", "Limited to JS/TS", "No boundary enforcement"]
    implementation:
      guidelines:
        - "Define pipeline in turbo.json with dependencies and output folders"
        - "Configure outputs for caching (dist/, .next/, build/)"
        - "Set up remote caching via Vercel for CI"
        - "Use pnpm workspaces with Turborepo"
      common_errors:
        - error: "Cache outputs not configured"
          impact: "Caching disabled; every run rebuilds everything"
          fix: "Set outputs in turbo.json for every task producing artifacts"
        - error: "No package boundaries — internal imports from sibling internals"
          impact: "Circular dependencies; hard to refactor"
          fix: "Define clean public API per package (index.ts exports only)"
    maturity:
      level: standard
    standards:
      - name: "Turborepo"
        type: tool
        role: "Monorepo build system for JS/TS"
        status: recommended

  - id: bazel_pants
    name: "Bazel / Pants"
    description: >
      Language-agnostic build systems for large polyglot monorepos.
      Hermetic builds, distributed caching, remote execution. Supports
      any language with extensible rules.
    use_when:
      - "Polyglot repo with multiple languages"
      - "Enterprise scale (hundreds of projects)"
      - "Full build reproducibility required"
    avoid_when:
      - "Single language (specialized tools simpler)"
      - "Small team or repo (complexity not justified)"
    tradeoffs:
      pros: ["Hermetic builds — reproducible", "Distributed caching and execution", "Language-agnostic"]
      cons: ["Very steep learning curve (Starlark)", "Significant setup effort", "Strict hermeticity breaks existing tools"]
    implementation:
      guidelines:
        - "Define BUILD.bazel files per target with explicit dependencies"
        - "Use bzlmod for dependency management (Bazel 7+)"
        - "Configure remote cache for CI sharing"
        - "Use generated BUILD files (gazelle for Go)"
      common_errors:
        - error: "Missing dependency declarations in BUILD files"
          impact: "Cache invalidation misses changes; stale outputs"
          fix: "Use automated dependency management tools; review BUILD hygiene"
        - error: "Too few BUILD targets — monolithic package files"
          impact: "Fine-grained caching defeated"
          fix: "Define granular BUILD targets per build unit"
    maturity:
      level: enterprise
    standards:
      - name: "Bazel"
        type: framework
        role: "Language-agnostic build system"
        status: recommended

  - id: package_based_monorepo
    name: "Package-Based (pnpm Workspaces, Rush)"
    description: >
      Independently versioned and published packages. pnpm workspaces for
      strict dependency isolation. Rush for build orchestration and
      coordinated version bumps.
    use_when:
      - "Independent deployment with separate versioning"
      - "Team ownership per package"
      - "Publishing packages to registries"
    avoid_when:
      - "Coordinated releases requiring atomic changes"
      - "Shared build tooling preferred"
    tradeoffs:
      pros: ["Clear package boundaries", "Independent versioning", "Strict dependency isolation"]
      cons: ["Duplicated tooling across packages", "Cross-package refactoring harder", "No unified build graph"]
    implementation:
      guidelines:
        - "Use pnpm workspaces for strict dependency isolation"
        - "Use workspace protocol (workspace:*) for internal deps"
        - "Publish with semantic-release per package"
        - "Use changesets or Rush for changelog generation"
      common_errors:
        - error: "Leaky internal imports across packages"
          impact: "Refactoring breaks hidden dependencies"
          fix: "Enforce imports from public exports only; use ESLint import/no-restricted-paths"
        - error: "Circular dependencies between packages"
          impact: "Build failures and runtime errors"
          fix: "Enforce dependency direction layers; extract shared code to lower layer"
    maturity:
      level: standard
    standards:
      - name: "pnpm Workspaces"
        type: tool
        role: "Package manager with workspace support"
        status: recommended

examples:
  - id: nx_affected_ci
    title: "Nx Affected CI"
    context: "CI building only affected projects"
    correct: |
      steps:
        - uses: actions/checkout@v4; fetch-depth: 0
        - run: npx nx affected -t lint test build --base=origin/main
        - run: npx nx-cloud start-ci-run
    incorrect: |
      - run: npm run build  # Builds everything every time
    explanation: "Nx affected builds only changed projects and their dependents, reducing CI time proportionally to change scope."

security_hardening:
  transport:
    requirements:
      - "Package registry access authenticated with tokens"
      - "Build artifact transfers over TLS"
  data_protection:
    requirements:
      - "Build artifacts contain no secrets or env vars"
      - "Lock files scanned for dependency vulnerabilities"
  access_control:
    requirements:
      - "CI registry write access restricted to pipelines"
      - "Code review required for shared library changes"
  input_output:
    requirements:
      - "Dependency packages validated with integrity hashes"
      - "Generated code reviewed before commit"
  secrets:
    requirements:
      - "NPM tokens and API keys in CI secrets, not code"
      - "No secrets in .npmrc or publishConfig"
  monitoring:
    requirements:
      - "Monitor CI build times and cache hit ratios"
      - "Alert on dependency vulnerability findings"

compliance:
  standards:
    - name: "NIST SP 800-218 (SSDF)"
      relevance: "Secure software development — dependency scanning in CI"
    - name: "ISO 27001 (A.8.9)"
      relevance: "Configuration and change control in monorepo"

  requirements_mapping:
    - control: build_integrity
      description: "Build artifacts reproducible and verified"
      maps_to: ["NIST SP 800-218 PS-1"]
    - control: dependency_management
      description: "Dependencies scanned and integrity-verified"
      maps_to: ["ISO 27001 A.8.9"]

prompt_recipes:
  - id: monorepo_greenfield
    scenario: greenfield
    description: "Design monorepo architecture"
    prompt: |
      Design monorepo: size=[small/medium/large/enterprise], languages=[JS-TS/polyglot],
      code-sharing=[yes/no], deploy=[independent/coordinated].
      JS-TS small/medium → Turborepo. JS-TS large → Nx. Polyglot enterprise → Bazel.
      Independent versioning → pnpm workspaces.

  - id: monorepo_migration
    scenario: migration
    description: "Migrate multi-repo to monorepo"
    prompt: |
      1. Audit repos and dependencies 2. Design structure (packages/, apps/, libs/)
      3. Define public API per package 4. Start with shared libraries 5. Migrate apps one at a time
      6. Interleave old repos during transition.

  - id: monorepo_ci_optimization
    scenario: performance
    description: "Optimize monorepo CI"
    prompt: |
      Optimize: 1. Affected detection — only build changed 2. Remote caching — share artifacts
      3. Task parallelization 4. Dependency caching 5. Pipeline ordering: lint > typecheck > test > build.

  - id: monorepo_audit
    scenario: audit
    description: "Audit monorepo health"
    prompt: |
      Audit: 1. Module boundaries enforced? 2. Cache hit ratio >60%? 3. CI time proportional to change scope?
      4. Shared libs properly versioned? 5. Dependencies scanned? 6. Circular deps prevented? 7. Structure documented?

anti_patterns:
  - name: "Giant Monolith in Monorepo"
    description: "Single large project with no decomposition; monorepo tooling cannot parallelize."
    fix: "Decompose into well-defined packages with public APIs"
    severity: high
    related_pattern: nx_monorepo

  - name: "CI That Builds Everything"
    description: "Full build on every commit; CI times grow linearly with repo size."
    fix: "Implement affected detection; only build/test changed projects"
    severity: high
    related_pattern: turborepo

  - name: "No Lockfile"
    description: "No lockfile in monorepo; non-deterministic builds and unexpected breakage."
    fix: "Commit lockfile; use integrity verification"
    severity: critical
    related_pattern: package_based_monorepo

checklist:
  - id: MONO-01
    category: performance
    description: "Affected detection implemented in CI"
    severity: high
    verified_by: nx_monorepo
  - id: MONO-02
    category: performance
    description: "Remote caching configured"
    severity: high
    verified_by: turborepo
  - id: MONO-03
    category: design
    description: "Module boundaries enforced with tags/lint"
    severity: high
    verified_by: nx_monorepo
  - id: MONO-04
    category: maintainability
    description: "Lockfile committed and verified"
    severity: critical
    verified_by: package_based_monorepo
  - id: MONO-05
    category: security
    description: "Dependencies scanned for vulnerabilities"
    severity: critical
    verified_by: package_based_monorepo
  - id: MONO-06
    category: design
    description: "No circular dependencies between packages"
    severity: high
    verified_by: nx_monorepo
  - id: MONO-07
    category: security
    description: "CI secrets in vault, not in repo files"
    severity: critical
    verified_by: nx_monorepo
