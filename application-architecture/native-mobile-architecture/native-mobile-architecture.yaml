prompt_recipes:
  - id: mobile_architecture_design
    scenario: greenfield
    description: "Design mobile app architecture from scratch"
    prompt: |
      Design the mobile application architecture.

      Context:
      - Platforms: [iOS/Android/both]
      - Performance needs: [standard/high-performance/real-time]
      - Native API usage: [minimal/moderate/extensive]
      - Team expertise: [native/cross-platform]

      Requirements:
      - Framework selection (React Native / Flutter / native)
      - State management approach
      - Navigation and routing
      - API layer design
      - Offline and caching strategy
      - Push notification integration
      - Deep linking configuration
      - Build and deployment pipeline

  - id: mobile_bridge_module
    scenario: architecture
    description: "Design a native bridge module for cross-platform app"
    prompt: |
      Design a native bridge module for the mobile app.

      Native feature: [camera/Bluetooth/biometrics/sensors/etc.]
      Framework: [React Native / Flutter]

      Requirements:
      - Type-safe interface between JS/Dart and native code
      - Error handling strategy (typed errors, fallbacks)
      - Resource lifecycle management (initialize, use, dispose)
      - Thread management (background for heavy operations)
      - Testing strategy for the bridge boundary
      - Platform-specific behaviors (iOS vs Android differences)

  - id: ota_rollout_plan
    scenario: operations
    description: "Plan OTA update rollout strategy"
    prompt: |
      Plan the OTA update rollout strategy.

      Platform: [expo-updates / Shorebird]
      App: [app name]

      Plan:
      1. Update channel configuration (dev, staging, canary, production)
      2. Staged rollout percentages and criteria
      3. Monitoring during rollout (crash rate, error rate, user feedback)
      4. Rollback triggers and process
      5. Update metadata (mandatory vs optional, release notes)
      6. Testing OTA updates in CI/CD pipeline
      7. Communication plan for users about updates

  - id: mobile_app_security_review
    scenario: high-security
    description: "Review mobile app security posture"
    prompt: |
      Review the mobile app's security posture.

      Checklist:
      1. Is TLS 1.2+ enforced with certificate pinning?
      2. Is sensitive data stored in platform secure storage (Keychain/Keystore)?
      3. Are deep links validated — no open redirect or URL injection?
      4. Is root/jailbreak detection implemented for sensitive apps?
      5. Are API keys and tokens injected at runtime, not in the bundle?
      6. Is app transport security configured to block cleartext?
      7. Are WebView's restricted to safe allowlists?
      8. Is crash reporting implemented with PII redaction?
      9. Is the OTA update manifest signed and verified?
      10. Are push notification payloads sanitized before processing?

anti_patterns:
  - name: "One-Size-Fits-All Cross-Platform"
    description: >
      Using a single cross-platform framework for every feature including
      platform-specific interactions. Complex native features (ARKit, Camera2,
      HealthKit) are forced through a leaky abstraction, resulting in poor
      performance, limited functionality, and brittle bridge code.
    fix: "Use cross-platform for shared business logic; implement platform-specific features natively with well-defined bridge interfaces"
    severity: medium
    related_pattern: native_bridge_architecture

  - name: "No OTA Rollback Strategy"
    description: >
      Pushing OTA updates without maintaining previous versions or implementing
      automatic rollback. A broken update leaves users stranded until the next
      successful push, which is especially critical for mandatory updates that
      may crash on launch.
    fix: "Always keep the previous working bundle locally; implement crash-loop detection for automatic rollback"
    severity: high
    related_pattern: ota_updates_codepush

  - name: "Hardcoded Secrets in App Bundle"
    description: >
      Bundling API keys, tokens, or other secrets in the mobile app binary or
      JavaScript bundle. These can be extracted via static analysis of the IPA
      or APK. Compromised keys can be used to abuse backend services.
    fix: "Inject secrets at runtime via a secure config service; use platform secure storage for cached tokens"
    severity: critical
    related_pattern: cross_platform_react_native

