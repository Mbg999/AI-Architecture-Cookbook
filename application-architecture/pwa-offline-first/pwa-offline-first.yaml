  input_output:
    requirements:
      - "All user input sanitized"
  secrets:
    requirements:
      - "No secrets in client-side code"
  monitoring:
    requirements:
      - "Errors logged with context for debugging"

compliance:
  standards:
    - name: "OWASP"
      relevance: "Frontend security best practices"
  requirements_mapping:
    - control: secure_communication
      description: "All frontend communication uses secure channels"
      maps_to:
        - "OWASP: secure communication"

prompt_recipes:
  - id: pwa_setup
    scenario: greenfield
    description: "Set up PWA from scratch"
    prompt: "Set up PWA for {app_name}.\n\nSteps:\n1. Configure manifest.json with icons, name, theme color\n2. Create service worker with Workbox\n3. Set up caching strategies per content type\n4. Register service worker after load\n5. Implement install prompt\n6. Test offline behavior"
  - id: offline_migration
    scenario: migration
    description: "Add offline support to existing app"
    prompt: "Add offline support to {app_name}.\n\nPlan:\n1. Audit current network dependencies\n2. Implement service worker with workbox\n3. Cache static assets on install\n4. Add Stale-While-Revalidate for API endpoints\n5. Queue mutations with Background Sync\n6. Add offline UI indicators\n7. Test offline scenarios"
  - id: sw_update
    scenario: migration
    description: "Implement service worker update flow"
    prompt: "Implement service worker update strategy for {app_name}.\n\nSteps:\n1. Configure versioned cache names\n2. Detect service worker updates on navigation\n3. Show update available prompt to user\n4. Implement skipWaiting on user confirmation\n5. Clear old caches on activation\n6. Test update flow end to end"
  - id: pwa_audit
    scenario: audit
    description: "Audit PWA implementation for best practices"
    prompt: "Audit PWA implementation for {app_name}.\n\nChecklist:\n1. Service worker registered after page load\n2. Offline fallback page provided\n3. Manifest configured with correct icons\n4. Caching strategies differ by content type\n5. Cache size limits set (maxEntries, maxAgeSeconds)\n6. Install prompt implemented (beforeinstallprompt)\n7. Lighthouse PWA audit passes"

anti_patterns:
  - name: "No Offline Fallback"
    description: "Service worker installed but no offline fallback page. Users see browser's offline page when disconnected."
    fix: "Implement an offline fallback page cached during service worker install."
    severity: high
    related_pattern: standard_pwa_setup
  - name: "Caching Everything Unconditionally"
    description: "Service worker caches every request including API mutations. Stale data is never invalidated."
    fix: "Use different strategies per content type. Set cache expiration policies."
    severity: medium
    related_pattern: standard_pwa_setup
  - name: "No Cache Invalidation Strategy"
    description: "Old cached assets persist, showing stale content even after app update."
    fix: "Use versioned cache names. Implement service worker update flow with skipWaiting."
    severity: medium
    related_pattern: cache_first_static

