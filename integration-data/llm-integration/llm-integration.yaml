      maps_to:
        - "FinOps best practices"

prompt_recipes:
  - id: llm_greenfield
    scenario: greenfield
    description: "Design LLM integration from scratch"
    prompt: |
      Design LLM integration for {application}.

      Context:
      - Model source: [api_managed/self_hosted/hybrid]
      - Cost sensitivity: [low/medium/high]
      - Latency requirement: [realtime/interactive/batch]
      - Privacy requirement: [strict/moderate/none]
      - Guardrails required: [yes/no]
      - Expected throughput: [low/medium/high/very_high]

      Architecture:
      1. Model selection: which model(s) and why?
      2. Integration: API or self-hosted SDK?
      3. Caching: semantic or exact-match? TTL strategy?
      4. Fallback: cascade tiers with circuit breakers?
      5. Guardrails: input and output rail types?
      6. Monitoring: token usage, cost, latency tracking?
      7. Error handling: retry, timeout, degrade strategy?

  - id: llm_cost_optimization
    scenario: performance
    description: "Optimize LLM costs"
    prompt: |
      Optimize LLM costs for {application}.

      Strategies:
      1. Analyze current spend breakdown by model, feature, user
      2. Implement semantic caching for frequent queries
      3. Cascade: route simple queries to cheaper models
      4. Reduce max_tokens and set per-feature token limits
      5. Batch non-urgent requests during off-peak pricing
      6. Quantize and self-host if volume justifies capex
      7. A/B test cheaper models on quality metrics
      8. Monitor cost per resolved user query

  - id: llm_audit
    scenario: audit
    description: "Audit LLM integration for security, quality, and compliance"
    prompt: |
      Audit LLM integration for {application}.

      Security:
      1. Are API keys in secrets manager (not code)?
      2. Is prompt injection detection active?
      3. Are PII/PHI redacted from prompts?
      4. Is model output moderated for harmful content?
      5. Are guardrail failures logged and alerted?

      Quality:
      1. Are retries with backoff configured?
      2. Is there a circuit breaker for API failures?
      3. Are responses validated for format and content?
      4. Is there a cascade fallback strategy?
      5. Are different features using appropriate-cost models?

      Compliance:
      1. Is LLM usage logged per user and feature?
      2. Is spend tracked and within budget?
      3. Does data processing agreement cover LLM API provider?
      4. Can user prompts be deleted on request (right to erasure)?

  - id: llm_migration
    scenario: migration
    description: "Migrate from one LLM provider to another"
    prompt: |
      Migrate {application} from {current_provider} to {target_provider}.

      Steps:
      1. Audit current model usage, prompt templates, and output formats
      2. Set up target provider API keys and secrets
      3. Implement provider abstraction layer
      4. Add target provider as secondary cascade tier (shadow mode)
      5. Compare response quality over 1-2 weeks
      6. Gradually shift traffic from tier2 to tier1
      7. Monitor quality metrics during transition
      8. Decommission old provider after stabilization

  - id: llm_high_security
    scenario: high-security
    description: "Design LLM integration for regulated environments"
    prompt: |
      Design LLM integration for {regulated_application} in {compliance_framework}.

      Constraints:
      - Data must not leave {region/on-prem environment}
      - Every response must be guardrailed and audited
      - Budget is secondary to compliance and safety

      Architecture:
      1. Self-host models using vLLM or TGI on {infrastructure}
      2. Input guard: prompt injection + PII redaction + topic filter
      3. Output guard: content moderation + consistency check
      4. Full audit trail: user, prompt, response, guard actions
      5. Model access control per user role
      6. Regular penetration testing of guard layers

anti_patterns:
  - name: "Hardcoded API Keys and Config"
    description: >
      Storing LLM API keys in source code, config files, or environment
      variables without a secrets manager. Keys leak through version
      control, CI logs, or dumped environment variables.
    fix: "Always use a secrets manager (AWS Secrets Manager, Vault, Azure Key Vault); inject keys at runtime"
    severity: critical
    related_pattern: standard_api_integration

  - name: "Unmonitored LLM Spend"
    description: >
      Deploying LLM features without tracking token usage or cost per
      user, per feature, or per model. Results in surprise bills,
      inability to attribute costs, and no ability to detect abuse.
    fix: "Track tokens and cost per request; set per-user budgets; alert on spend spikes"
    severity: high
    related_pattern: standard_api_integration

  - name: "No Fallback Strategy"
    description: >
      Relying on a single LLM provider without fallback. When the
      provider is down, rate-limited, or slow, the feature is completely
      unavailable with no graceful degradation.
    fix: "Implement cascade fallback: primary → secondary → cached → graceful degradation"
    severity: critical
    related_pattern: cascade_fallback

  - name: "No Input or Output Guardrails"
    description: >
      Sending user prompts directly to the LLM without input validation
      and returning raw model output without content moderation. Exposes
      users to prompt injection, harmful content, and data leakage.
    fix: "Implement input guard (injection, PII, topic) and output guard (moderation, PII, consistency)"
    severity: critical
    related_pattern: guarded_integration

  - name: "Always Using the Most Expensive Model"
    description: >
      Using the same expensive frontier model for all requests regardless
      of complexity. Simple tasks get over-served, driving up costs
      unnecessarily.
    fix: "Route requests by complexity: simple → cheap model, complex → frontier model"
    severity: medium
    related_pattern: standard_api_integration

