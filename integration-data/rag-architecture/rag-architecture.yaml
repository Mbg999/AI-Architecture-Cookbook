prompt_recipes:
  - id: rag_greenfield
    scenario: greenfield
    description: "Design a RAG system from scratch"
    prompt: |
      Design a RAG system for {application}.

      Context:
      - Corpus size: [small/medium/large/very_large]
      - Query complexity: [simple/moderate/complex]
      - Freshness requirement: [realtime/near_realtime/periodic/batch]
      - Grounding requirement: [strict/moderate/lenient]
      - Deployment environment: [cloud/on-premises/hybrid/embedded]

      Step 1 — Chunking: Choose between semantic (paragraph/section), code-aware, or agentic chunking. Specify chunk size and overlap.
      Step 2 — Embedding: Choose a model (open-source or API). Include model dims and quantization strategy.
      Step 3 — Vector store: Choose between lightweight (sqlite-vss, DuckDB), dedicated (Pinecone, Weaviate, Qdrant), or distributed cluster (Milvus). Justify selection based on corpus size.
      Step 4 — Retrieval: Choose between vector-only, hybrid vector+BM25, or multi-stage with reranking. Specify top-K and score threshold.
      Step 5 — Generation: Choose LLM, context window strategy, prompt template with citation format.
      Step 6 — Evaluation: Define faithfulness, recall, and precision metrics.

      Output a diagram showing the pipeline architecture and a brief rationale for each choice.

  - id: rag_optimization
    scenario: performance
    description: "Optimize RAG retrieval quality and latency"
    prompt: |
      Optimize the RAG pipeline for {application}.

      Retrieval quality optimization:
      1. Analyze top-K retrieval failures — are relevant documents missing?
      2. Compare vector-only vs hybrid search on a held-out query set
      3. Add cross-encoder reranking and measure NDCG improvement
      4. Test different chunk sizes (256, 512, 1024 tokens) on retrieval accuracy
      5. Implement query rewriting and measure hit rate improvement
      6. Evaluate alternative embedding models (BGE vs E5 vs OpenAI)

      Latency optimization:
      1. Profile end-to-end latency: chunking → embedding → retrieval → generation
      2. Measure vector store query time p50/p95/p99
      3. Batch embed documents during ingestion (not one at a time)
      4. Cache frequent queries and their retrieval results
      5. Quantize vectors (fp32 → int8) to reduce memory bandwidth
      6. Use approximate nearest neighbor (HNSW) instead of exhaustive search

  - id: rag_migration
    scenario: migration
    description: "Migrate from naive RAG to production-grade RAG"
    prompt: |
      Migrate {application} from basic RAG to production-grade RAG.

      Current state (naive):
      - Fixed-size character chunking
      - Single embedding model, no metadata
      - Vector-only retrieval, no reranking
      - No evaluation metrics

      Target state (production):
      - Semantic or agentic chunking with metadata
      - Hybrid search (vector + BM25) with cross-encoder reranking
      - Query rewriting and decomposition for complex queries
      - Hallucination detection and retrieval quality monitoring

      Migration plan:
      1. Audit current chunking quality — identify common failure cases
      2. Choose new chunking strategy and re-chunk the corpus
      3. Backfill metadata (source, date, version, permissions)
      4. Re-embed with the new model (test model quality on a sample first)
      5. Add BM25 index alongside the vector index
      6. Implement and tune cross-encoder reranker
      7. A/B test old vs new pipeline on 10% of traffic
      8. Monitor faithfulness scores before full rollout

  - id: rag_audit
    scenario: audit
    description: "Audit RAG system for quality, security, and compliance"
    prompt: |
      Audit the RAG system for {application}.

      Quality checklist:
      1. Are retrieved chunks semantically coherent (not split mid-sentence)?
      2. Does every retrieved chunk have score above the threshold?
      3. Is query rewriting in place for ambiguous user queries?
      4. Are LLM responses faithful to retrieved context?
      5. Are citations included in every response?
      6. Is there a "don't know" fallback when context is insufficient?
      7. Are faithfulness, recall, and precision metrics tracked over time?

      Security checklist:
      1. Is the LLM prompt protected against prompt injection from retrieved context?
      2. Are sensitive documents excluded from the vector index?
      3. Are retrieval results filtered by user authorization scope?
      4. Is all inter-service communication encrypted (TLS)?
      5. Are embedding and LLM API keys in a secrets manager?

      Compliance checklist:
      1. Can documents be deleted from the vector index on request (right to erasure)?
      2. Is every RAG query and response logged for auditing?
      3. Are vector store access logs retained for compliance period?
      4. Is PII/PHI handling documented and approved?

  - id: rag_high_security
    scenario: high-security
    description: "Design a RAG system for regulated environments"
    prompt: |
      Design a production RAG system for {regulated_application} in a
      {compliance_framework} (e.g., HIPAA, GDPR, SOC 2) environment.

      Constraints:
      - Strict grounding: every claim must cite a retrievable source document
      - No data leaks: retrieval results scoped to user's authorization level
      - Audit trail: every query and response logged with user, timestamp, and source docs
      - Right to erasure: documents must be deletable from vector index on request

      Architecture requirements:
      1. Document-level access controls propagated to chunk level
      2. Hybrid search (vector + BM25) with cross-encoder reranking for maximum relevance
      3. Faithfulness scoring on every response — alert on low scores
      4. Prompt template with explicit "don't know" instruction
      5. Retrieved context filtered by user's document permissions before LLM prompt
      6. Encryption at rest for vector store; TLS for all inter-service communication
      7. Retention policies for query logs and vector index snapshots

  - id: rag_edge
    scenario: edge-case
    description: "Design RAG for resource-constrained environments"
    prompt: |
      Design a RAG system for {edge_application} running on a device with
      {memory_limit}GB RAM and {compute_profile} (CPU/GPU).

      Constraints:
      - No cloud API calls (data sovereignty / offline operation)
      - Maximum memory budget: {memory_budget}
      - Latency budget: {max_latency}ms

      Design choices:
      1. Embedding model: which sentence-transformers model fits in the memory budget?
      2. Vector store: sqlite-vss, DuckDB, or LanceDB? Justify memory usage.
      3. LLM: which quantized model (Phi-3, Llama-3.2-3B, Gemma-2-2B)?
      4. Chunking: optimize chunk size for the LLM's context window
      5. Index quantization: int8 or binary quantization to reduce memory
      6. Caching: pre-compute embeddings for static documents

anti_patterns:
  - name: "RAG Without Evaluation"
    description: >
      Deploying a RAG pipeline without measuring faithfulness, retrieval
      recall, or answer relevance. Without metrics, you can't detect
      hallucination, poor retrieval quality, or regression after changes.
    fix: "Implement evaluation from day one: faithfulness score, answer relevance, context recall, and precision (e.g., RAGAS framework)"
    severity: critical
    related_pattern: standard_rag

  - name: "Context Dumping Without Filtering"
    description: >
      Retrieving the top-K chunks without a similarity threshold and passing
      all of them to the LLM, including irrelevant or low-scoring chunks.
      The LLM gets distracted by irrelevant context, increasing hallucination.
    fix: "Set a similarity threshold (typically 0.6-0.8); only pass chunks above threshold. Limit to 3-10 highest quality chunks."
    severity: high
    related_pattern: standard_rag

  - name: "Fixed-Size Character Chunking"
    description: >
      Splitting documents at fixed character boundaries without regard for
      sentence, paragraph, or code structure. Produces incoherent chunks
      that confuse both retrieval (noisy vector) and generation (broken context).
    fix: "Use semantic chunking that respects document structure: section boundaries, paragraphs, sentences. Add overlap for context preservation."
    severity: high
    related_pattern: standard_rag

  - name: "No Query Rewriting"
    description: >
      Feeding the user's raw query directly into vector search without
      rewriting or expanding it. Ambiguous queries ("it", "the bug", "that
      PR") have no semantic specificity for effective retrieval.
    fix: "Implement query rewriting: expand abbreviations, resolve pronouns from conversation history, add domain context."
    severity: medium
    related_pattern: standard_rag

  - name: "RAG as Silver Bullet"
    description: >
      Assuming RAG solves all LLM limitations without proper architecture.
      RAG requires ongoing tuning: chunking strategy, embedding selection,
      reranking, and evaluation. RAG without maintenance degrades over time.
    fix: "Treat RAG as a system that requires continuous monitoring and tuning — implement evaluation metrics and regular quality reviews."
    severity: medium
    related_pattern: standard_rag

