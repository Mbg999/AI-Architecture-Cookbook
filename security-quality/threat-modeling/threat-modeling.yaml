# =============================================================================
# AI Architecture Cookbook — Threat Modeling
# Schema: v3 | Domain: threat-modeling
# =============================================================================

meta:
  schema_version: 3
  domain: threat-modeling
  version: "1.0.0"
  last_updated: "2026-06-04"
  description: >
    Threat modeling patterns: STRIDE per component for comprehensive analysis,
    attack tree analysis for multi-step attacks, DREAD scoring for prioritization,
    and threat modeling as code for automated security review integrated into SDLC.

  tags:
    - threat-modeling
    - stride
    - attack-tree
    - dread
    - security-requirements

  categories:
    - security-quality

  prerequisites:
    - secure-sdlc
    - api-design

  related_standards:
    - id: secure-sdlc
      relationship: complementary
      context: "Threat modeling is a core SDLC security activity"
    - id: api-design
      relationship: complementary
      context: "APIs are primary threat surface; modeling identifies API threats"
    - id: encryption
      relationship: complementary
      context: "Threats identified by modeling often require encryption"

context_inputs:
  - name: system_criticality
    type: enum
    description: "System criticality"
    required: true
    default: standard
    enum_values: [low, standard, high, critical]

  - name: threat_type_focus
    type: enum
    description: "Primary threat categories"
    required: true
    default: stride_full
    enum_values: [stride_full, privacy_focused, infrastructure_focused, application_focused, compliance_driven]

  - name: model_depth
    type: enum
    description: "Depth of analysis"
    required: true
    default: component_level
    enum_values: [system_level, component_level, data_flow_level, code_level]

  - name: automation_level
    type: enum
    description: "Automation level"
    required: false
    default: manual
    enum_values: [manual, semi_automated, fully_automated]

  - name: team_experience
    type: enum
    description: "Team experience with threat modeling"
    required: false
    default: beginner
    enum_values: [beginner, intermediate, advanced]

decision_tree:
  - id: stride_comprehensive
    priority: 1
    if:
      - threat_type_focus == stride_full
      - model_depth in [component_level, data_flow_level]
    then:
      pattern: stride_per_component
      standards: ["STRIDE"]
      notes: "STRIDE covers all six threat categories per component. Most comprehensive methodology."

  - id: attack_tree_critical
    priority: 2
    if:
      - system_criticality in [high, critical]
      - model_depth in [data_flow_level, code_level]
    then:
      pattern: attack_tree_analysis
      standards: ["Attack Trees (Schneier)"]
      notes: "Critical systems benefit from attack trees for multi-step attack path analysis."

  - id: dread_prioritization
    priority: 3
    if:
      - team_experience in [beginner, intermediate]
      - threat_type_focus != compliance_driven
    then:
      pattern: dread_prioritization
      standards: ["DREAD"]
      notes: "DREAD provides simple threat scoring for teams new to threat modeling."

  - id: threat_modeling_as_code
    priority: 4
    if:
      - automation_level in [semi_automated, fully_automated]
      - team_experience in [intermediate, advanced]
    then:
      pattern: threat_modeling_as_code
      standards: ["OWASP Threat Dragon", "Threatspec"]
      notes: "Threat models in version control, reviewed in PRs, verified in CI."

  - id: compliance_driven
    priority: 5
    if:
      - threat_type_focus == compliance_driven
    then:
      pattern: stride_per_component
      notes: "Compliance mandates systematic threat identification. STRIDE provides audit evidence."

decision_metadata:
  confidence: high
  risk_if_wrong: critical
  fallback:
    pattern: stride_per_component
    description: "STRIDE per component is the most broadly applicable approach"

patterns:
  - id: stride_per_component
    name: "STRIDE per Component"
    description: >
      Systematic threat analysis using STRIDE: Spoofing, Tampering, Repudiation,
      Information Disclosure, Denial of Service, Elevation of Privilege. Each
      component analyzed against all six categories.
    use_when:
      - "Comprehensive threat analysis needed"
      - "Compliance requiring systematic assessment"
      - "Security review milestone in SDLC"
    avoid_when:
      - "Very simple systems (overhead not justified)"
    tradeoffs:
      pros: ["Comprehensive coverage (6 categories)", "Structured and repeatable", "Compliance-friendly"]
      cons: ["Time-consuming per component", "Repetitive across similar components", "High output volume"]
    implementation:
      guidelines:
        - "Create data flow diagram as foundation"
        - "For each component, assess all six STRIDE categories"
        - "Document: component, threat type, description, impact, mitigation"
        - "Focus on data crossing trust boundaries (highest risk)"
        - "Track threats to mitigations in traceability matrix"
      common_errors:
        - error: "Threat modeling without data flow diagram"
          impact: "Components and data flows missed"
          fix: "Always create DFD first as visual reference"
        - error: "No mitigation tracking"
          impact: "Known risks remain unaddressed"
          fix: "Assign owners and deadlines per mitigation; track in issue tracker"
    maturity:
      level: standard
    standards:
      - name: "STRIDE (Microsoft)"
        type: reference
        role: "Threat categorization methodology"
        status: recommended

  - id: attack_tree_analysis
    name: "Attack Tree Analysis"
    description: >
      Hierarchical attack paths with AND/OR logic. Root = attacker goal.
      Leaf nodes = atomic attacks. Identifies weakest path: easiest
      combination of steps.
    use_when:
      - "Critical systems needing deep analysis"
      - "Complex multi-step attack scenarios"
      - "Penetration test planning"
    avoid_when:
      - "Rapid identification (STRIDE faster)"
    tradeoffs:
      pros: ["Clear visual attack paths", "Identifies weakest link", "AND/OR shows dependencies", "Leaf nodes = pen test cases"]
      cons: ["Time-consuming to build", "Trees grow large", "No built-in prioritization"]
    implementation:
      guidelines:
        - "Start with attacker goals as root nodes"
        - "Decompose with AND (all needed) and OR (any suffices)"
        - "Annotate leaf nodes: cost, skill, detection probability, impact"
        - "Calculate easiest path: min cost, max impact"
        - "Prune infeasible branches"
      common_errors:
        - error: "Tree too high-level; leaf nodes not atomic"
          impact: "Cannot assess feasibility; tree not actionable"
          fix: "Decompose until each leaf is a single, specific attack action"
        - error: "AND vs OR logic incorrect"
          impact: "Weakest link misidentified"
          fix: "Review: AND = all required; OR = any suffices"
    maturity:
      level: advanced
    standards:
      - name: "Attack Trees (Bruce Schneier)"
        type: reference
        role: "Foundational attack tree methodology"
        status: recommended

  - id: dread_prioritization
    name: "DREAD Prioritization"
    description: >
      Risk scoring: Damage, Reproducibility, Exploitability, Affected Users,
      Discoverability. Each scored 1-10; average = DREAD score for ranking.
    use_when:
      - "Prioritizing threat backlog"
      - "Teams new to threat modeling"
      - "Comparing relative risk across threats"
    avoid_when:
      - "Regulatory compliance requiring documented methodology (use STRIDE)"
    tradeoffs:
      pros: ["Simple scoring, easy to learn", "Comparable scores", "Transparent rationale"]
      cons: ["Subjective scoring", "Discoverability controversial", "No mitigation cost context"]
    implementation:
      guidelines:
        - "Score all five dimensions 1-10 per threat"
        - "Define thresholds: 40-50 critical, 30-39 high, 20-29 medium"
        - "Score with team consensus"
        - "Default discoverability to 10 (assume attackers find everything)"
        - "Re-score after mitigations"
      common_errors:
        - error: "Discoverability scored low to deprioritize"
          impact: "Known vulnerabilities ignored"
          fix: "Default discoverability=10; document rationale if lower"
        - error: "Score inflation — all threats critical"
          impact: "No differentiation; prioritization impossible"
          fix: "Distribute scores; calibrate with team"
    maturity:
      level: standard
    standards:
      - name: "DREAD (Microsoft)"
        type: reference
        role: "Threat risk scoring methodology"
        status: recommended

  - id: threat_modeling_as_code
    name: "Threat Modeling as Code"
    description: >
      Threat models as structured files (YAML/JSON) in the repository.
      OWASP Threat Dragon, Threatspec, and pytm generate reports and
      diagrams. Changes reviewed in PRs; automated checks verify mitigations.
    use_when:
      - "Security automation maturity is high"
      - "Threat modeling in CI/CD"
      - "Version-controlled artifacts needed for compliance"
    avoid_when:
      - "Small team; manual works well"
      - "No CI/CD pipeline"
    tradeoffs:
      pros: ["Version-controlled with code", "PR reviewable", "Automated reports and verification"]
      cons: ["Tool maturity varies", "Learning curve per tool", "Diagram generation limited"]
    implementation:
      guidelines:
        - "Choose tool: Threat Dragon (visual+code), Threatspec (annotations), pytm (Python→DFD)"
        - "Store alongside component code"
        - "Add threat model review to PR checklist"
        - "Generate reports automatically in CI"
        - "Link threats to security test cases"
      common_errors:
        - error: "One-time artifact, not updated with code"
          impact: "Stale model references deleted components"
          fix: "Enforce model update in PR checklist; CI checks timestamp against code changes"
        - error: "Automation without manual analysis"
          impact: "Generic threats only; domain-specific threats missed"
          fix: "Use automation for coverage; supplement with expert review for critical components"
    maturity:
      level: enterprise
    standards:
      - name: "OWASP Threat Dragon"
        type: tool
        role: "Open-source threat modeling tool"
        status: recommended
      - name: "Threatspec"
        type: tool
        role: "Annotation-based threat modeling"
        status: recommended

security_hardening:
  transport:
    requirements:
      - "Data flow diagrams include all network trust boundaries"
      - "All inter-component comms identified as threat vectors"
  data_protection:
    requirements:
      - "Data stores classified by sensitivity"
      - "Encryption controls mapped to info disclosure threats"
  access_control:
    requirements:
      - "Auth and authorization mapped to spoofing and EoP"
      - "Privilege boundaries identified for EoP analysis"
  input_output:
    requirements:
      - "Input points analyzed as tampering and DoS vectors"
      - "API endpoints analyzed for injection threats"
  secrets:
    requirements:
      - "All secrets identified as tampering/disclosure targets"
      - "Hardcoded creds flagged as critical finding"
  monitoring:
    requirements:
      - "Detection controls mapped per threat"
      - "Audit logging identified as repudiation countermeasure"

examples:
  - id: stride_api_analysis
    title: "STRIDE Analysis of an API Endpoint"
    context: "Threat model for payment API"
    correct: |
      # STRIDE per component — Payment API
      threats:
        Spoofing:   "Attacker impersonates merchant → signed JWTs with audience check"
        Tampering:  "Attacker modifies amount in transit → TLS + payload signature"
        Repudiation: "User denies transaction → audit log with timestamp + IP"
        Information: "Attacker reads credit card → encryption + tokenization"
        Denial:     "Attacker overwhelms endpoint → rate limiting + WAF"
        Elevation:  "Attacker escalates from user to admin → RBAC + least privilege"
    incorrect: |
      # No structured threat model
      # "We handle security via HTTPS and authentication"
      # No STRIDE, no attack tree, no per-threat mitigation
    explanation: >
      STRIDE provides a systematic framework covering all threat categories.
      Each threat has a specific mitigation. The incorrect version is vague.

compliance:
  standards:
    - name: "PCI DSS 11.5 (Security Testing)"
      relevance: "Threat modeling required for cardholder data environments"
    - name: "NIST SP 800-115"
      relevance: "Threat modeling methodology for security assessments"
    - name: "OWASP ASVS"
      relevance: "Threat modeling required for ASVS Level 2 and 3"

  requirements_mapping:
    - control: threat_identification
      description: "Systematic threat identification per component"
      maps_to: ["PCI DSS 11.5", "NIST SP 800-115 §3.2"]
    - control: risk_prioritization
      description: "Threats prioritized by risk"
      maps_to: ["PCI DSS 6.2"]
    - control: mitigation_tracking
      description: "Threats tracked to mitigation with verification"
      maps_to: ["OWASP ASVS V1.1"]

prompt_recipes:
  - id: threat_model_greenfield
    scenario: greenfield
    description: "Create threat model for new system"
    prompt: |
      Process: 1. Create DFD (components, data stores, trust boundaries) 2. Apply STRIDE per component
      3. Score with DREAD 4. Document mitigations 5. Track in issues.
      Focus: data crossing trust boundaries, auth components, external integrations, sensitive data.

  - id: threat_model_audit
    scenario: audit
    description: "Audit existing threat model"
    prompt: |
      Audit: 1. DFD exists? 2. Trust boundaries identified? 3. All six STRIDE per component?
      4. Threats specific and actionable? 5. Mitigations for critical/high? 6. Owners and dates?
      7. Model current with architecture? 8. Accepted risks documented?

  - id: threat_model_ci
    scenario: migration
    description: "Integrate threat modeling into CI/CD"
    prompt: |
      1. Choose as-code tool (Threat Dragon/Threatspec/pytm) 2. Define template for new features
      3. Store model alongside code 4. CI check: model exists per component 5. PR checklist: model updated
      6. CI generates threat report 7. Link threats to security test cases.

  - id: threat_model_incident
    scenario: edge-case
    description: "Threat model based on incident"
    prompt: |
      1. Map attack path on DFD 2. Which STRIDE category? 3. Which component/trust boundary breached?
      4. Why did controls fail? 5. What mitigations block this path? 6. Re-score with DREAD.
      7. Review other components for similar vulnerabilities.

  - id: threat_model_pen_test
    scenario: high-security
    description: "Use attack trees for pen test planning"
    prompt: |
      1. Build attack trees for critical goals 2. Identify easiest paths (lowest cost, highest impact)
      3. Prioritize test cases: leaf nodes on easiest path first 4. Document tools and success criteria
      5. Update tree with findings 6. Verify mitigations for exploited paths.

anti_patterns:
  - name: "Threat Modeling Once, Never Updated"
    description: "Threat model created during initial design, never revisited as architecture evolves."
    fix: "Integrate model updates into dev process; require review for significant changes"
    severity: high
    related_pattern: stride_per_component

  - name: "Security Theater Threat Modeling"
    description: "Vague threats, all risks accepted, no mitigations implemented. Exists for checkbox compliance."
    fix: "Enforce documented mitigation per threat with owner and target date"
    severity: critical
    related_pattern: dread_prioritization

  - name: "Threat Model Without Data Flow Diagram"
    description: "Attempting STRIDE without DFD; components missed, trust boundaries ambiguous."
    fix: "Always create DFD as foundation for any threat modeling"
    severity: high
    related_pattern: stride_per_component

checklist:
  - id: TM-01
    category: security
    description: "Data flow diagram created for system"
    severity: high
    verified_by: stride_per_component
  - id: TM-02
    category: security
    description: "All six STRIDE categories analyzed per component"
    severity: high
    verified_by: stride_per_component
  - id: TM-03
    category: security
    description: "Trust boundaries identified and documented"
    severity: critical
    verified_by: stride_per_component
  - id: TM-04
    category: security
    description: "DREAD scores assigned for prioritization"
    severity: high
    verified_by: dread_prioritization
  - id: TM-05
    category: correctness
    description: "Mitigations for all critical/high threats"
    severity: critical
    verified_by: stride_per_component
  - id: TM-06
    category: maintainability
    description: "Threat model in version control with code"
    severity: high
    verified_by: threat_modeling_as_code
  - id: TM-07
    category: maintainability
    description: "Threat model updated with architecture changes"
    severity: high
    verified_by: threat_modeling_as_code
  - id: TM-08
    category: security
    description: "Accepted risks documented with rationale"
    severity: high
    verified_by: dread_prioritization
